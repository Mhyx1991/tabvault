<!doctype html>
<!-- UI QA harness — loads the REAL dashboard.js against a stubbed chrome API
     with realistic seeded data. NOT shipped (lives in tests/). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TabVault QA — dashboard</title>
  <link rel="stylesheet" href="../../src/ui/dashboard.css">
  <script>
    // ---- chrome stub (must run before the deferred module script) ----
    const seedTabs = [
      { id: 1, windowId: 1, index: 0, url: 'https://mail.google.com/inbox', title: 'Inbox (12) - Gmail', groupId: -1, pinned: false, active: true, lastAccessed: Date.now() - 60000 },
      { id: 2, windowId: 1, index: 1, url: 'https://github.com/marcus/tabvault', title: 'tabvault: PR #42 review', groupId: -1, pinned: false, active: false, lastAccessed: Date.now() - 120000 },
      { id: 3, windowId: 1, index: 2, url: 'https://stackoverflow.com/questions/9999', title: 'TypeError: cannot read properties of undefined', groupId: -1, pinned: false, active: false, lastAccessed: Date.now() - 300000 },
      { id: 4, windowId: 1, index: 3, url: 'https://www.youtube.com/watch?v=abc', title: 'Lo-fi beats to code to', groupId: -1, pinned: false, active: false, lastAccessed: Date.now() - 3600000 },
      { id: 5, windowId: 1, index: 4, url: 'https://www.amazon.de/dp/B0XYZ', title: 'USB-C hub — Amazon', groupId: -1, pinned: false, active: false, lastAccessed: Date.now() - 7200000 },
      { id: 6, windowId: 1, index: 5, url: 'https://developer.mozilla.org/en-US/docs/Web/API/chrome.sidePanel', title: 'sidePanel - Chrome Developers', groupId: -1, pinned: false, active: false, lastAccessed: Date.now() - 86400000 * 9 },
      { id: 7, windowId: 1, index: 6, url: 'https://arxiv.org/abs/2401.12345', title: 'Attention Is All You Need revisited', groupId: -1, pinned: false, active: false, lastAccessed: Date.now() - 86400000 * 12 },
      { id: 8, windowId: 2, index: 0, url: 'https://news.ycombinator.com/', title: 'Hacker News', groupId: -1, pinned: false, active: false, lastAccessed: Date.now() - 900000 }
    ];
    const groups = new Map();
    window.__qa = { clicks: [], errors: [] };
    window.addEventListener('error', (e) => window.__qa.errors.push(String(e.message || e)));

    const listener = { addListener() {} };
    window.chrome = {
      runtime: {
        id: 'qa-test',
        getURL: (p) => new URL(p || '/', location.href).href,
        getManifest: () => ({ version: '1.1.0', manifest_version: 3 }),
        onInstalled: listener, onStartup: listener, onMessage: listener
      },
      storage: {
        local: {
          _d: new Map(),
          get: async (keys) => Object.fromEntries([].concat(keys).filter(k => window.chrome.storage.local._d.has(k)).map(k => [k, window.chrome.storage.local._d.get(k)])),
          set: async (o) => { for (const [k, v] of Object.entries(o)) window.chrome.storage.local._d.set(k, v); },
          remove: async (keys) => { for (const k of [].concat(keys)) window.chrome.storage.local._d.delete(k); }
        },
        sync: {
          _d: new Map(),
          get: async (keys) => Object.fromEntries([].concat(keys).filter(k => window.chrome.storage.sync._d.has(k)).map(k => [k, window.chrome.storage.sync._d.get(k)])),
          set: async (o) => { for (const [k, v] of Object.entries(o)) window.chrome.storage.sync._d.set(k, v); },
          remove: async (keys) => { for (const k of [].concat(keys)) window.chrome.storage.sync._d.delete(k); }
        }
      },
      alarms: { create: async () => {}, onAlarm: listener },
      action: { setBadgeText: async ({ text }) => { window.__qa.badge = text; }, setBadgeBackgroundColor: async () => {}, setTitle: async ({ title }) => { window.__qa.badgeTitle = title; } },
      tabs: {
        query: async () => seedTabs.map(t => ({ ...t })),
        get: async (id) => { const t = seedTabs.find(x => x.id === id); if (!t) throw new Error('No tab ' + id); return { ...t }; },
        create: async (p) => ({ id: 100 + Math.floor(Math.random() * 1000), ...p }),
        group: async ({ tabIds }) => { const gid = 500 + groups.size; groups.set(gid, { id: gid, title: '', color: 'grey', windowId: 1 }); return gid; },
        ungroup: async () => {},
        update: async (id, props) => ({ id, ...props }),
        remove: async () => {},
        move: async () => {},
        onCreated: listener, onUpdated: listener, onRemoved: listener, onMoved: listener, onAttached: listener, onDetached: listener
      },
      tabGroups: { query: async () => [...groups.values()], update: async (id, p) => Object.assign(groups.get(id) || {}, p), onUpdated: listener, onRemoved: listener },
      windows: {
        getAll: async () => [{ id: 1, type: 'normal', state: 'normal', incognito: false, focused: true }, { id: 2, type: 'normal', state: 'normal', incognito: false, focused: false }],
        getLastFocused: async () => ({ id: 1 }),
        create: async (p) => ({ id: 9, ...p }),
        update: async () => {},
        onCreated: listener, onRemoved: listener
      }
    };
  </script>
  <script type="module" src="../../src/ui/dashboard.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#2563EB"/><circle cx="16" cy="16" r="7.4" stroke="#fff" stroke-width="2.6"/><rect x="14.6" y="11.4" width="2.8" height="9.2" rx="1.4" fill="#fff"/></svg>
        </span>
        <span class="brand-name">TABVAULT</span>
        <span class="brand-tag">QA HARNESS</span>
      </div>
      <div class="searchbar" id="searchbar">
        <span class="search-icon" aria-hidden="true" data-icon="search"></span>
        <input id="global-search" type="search" placeholder="Search tabs and workspaces…" autocomplete="off" spellcheck="false" aria-label="Search tabs and workspaces">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <div id="search-results" class="search-results" role="listbox" aria-label="Search results" hidden></div>
      </div>
      <div class="topbar-right">
        <span id="protection-chip" class="protect-chip" title="Protection status"></span>
      </div>
    </header>
    <nav class="nav" id="nav" aria-label="Sections">
      <button class="nav-item" data-view="overview">Overview</button>
      <button class="nav-item" data-view="suggestions">Suggestions<span class="nav-count" id="nav-suggest" hidden></span></button>
      <button class="nav-item" data-view="workspaces">Workspaces</button>
      <button class="nav-item" data-view="history">History</button>
      <button class="nav-item" data-view="care">Duplicates &amp; Stale<span class="nav-count" id="nav-care" hidden></span></button>
      <button class="nav-item" data-view="settings">Settings</button>
      <button class="nav-item" data-view="privacy">Privacy</button>
    </nav>
    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
    <footer class="footer">
      <span>TabVault v<span id="app-version">?</span> · QA HARNESS — data is fake</span>
      <span id="storage-status" class="footer-status"></span>
    </footer>
  </div>
</body>
</html>
